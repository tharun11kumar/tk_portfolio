<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tharun Kumar — Editor, photographer and filmmaker</title>
<meta name="description" content="Portfolio of Tharun Kumar — video editor, photographer and filmmaker in Chennai.">
<meta name="theme-color" content="#0b0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // entrances hide content until script.js shows it; if script.js never runs, show everything anyway
  document.documentElement.classList.add("js");
  setTimeout(function(){ if(!window.__tkReady) document.documentElement.classList.remove("js"); }, 2500);
</script>
</head>
<body>

<a class="skip" href="#work">Skip to the work</a>

<!-- the glow and the drifting points behind everything -->
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<canvas id="field" aria-hidden="true"></canvas>

<!-- ============ TOP BAR ============ -->
<header class="bar">
  <a href="#top" class="bar-mark" id="bar-mark" aria-label="Back to top">TK</a>
  <nav class="bar-links" aria-label="Sections">
    <a href="#work">Work</a>
    <a href="#photography">Photos</a>
    <a href="#about">About</a>
    <a href="#roles" class="bar-opt">Roles</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main>

<!-- ============ HERO: the name as a title card ============ -->
<section id="top" class="hero">
  <div class="hero-text rv">
    <p class="hero-role" id="hero-role"><!-- content.role --></p>
    <blockquote class="hero-blurb">
      <p id="hero-blurb"><!-- content.hero.blurb --></p>
      <cite id="hero-blurb-by"><!-- content.hero.blurbBy --></cite>
    </blockquote>
    <a class="btn" href="#work">See the work</a>
  </div>

  <figure class="hero-frame rv" style="--d:90ms">
    <!-- your photos, built out of particles by particles.js -->
    <div class="hero-stage" id="hero-stage" role="button" tabindex="0" aria-label="Show the next photo">
      <canvas id="hero-particles" aria-hidden="true"></canvas>
    </div>
    <button class="sound-btn" id="sound-toggle" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span class="sound-label">React to sound</span>
    </button>
  </figure>

  <div class="hero-side rv" style="--d:180ms">
    <dl class="hero-slate" id="slate"><!-- content.hero.slate --></dl>
    <dl class="hero-slate hero-now">
      <div><dt>On screen</dt><dd id="hero-caption-title"></dd></div>
      <div aria-hidden="true"><dt>Timecode</dt><dd class="tc" id="timecode">00:00:00:00</dd></div>
    </dl>
  </div>

  <h1 class="name" id="name">
    <span class="name-line"><span class="name-inner">Tharun Kumar</span></span>
  </h1>
</section>

<!-- ============ WORK: a screen, and the work in labelled rows ============ -->
<section id="work" class="work" aria-labelledby="work-title">
  <div class="work-head">
    <h2 class="work-title rv" id="work-title">Work</h2>
    <div class="work-filter rv" style="--d:80ms" role="group" aria-label="Filter work" id="tabs"><!-- content.categories --></div>
  </div>

  <div class="screen-wrap rv" style="--d:120ms">
    <button class="screen" id="screen" type="button">
      <span class="screen-media" id="screen-media"></span>
      <span class="screen-play" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
      </span>
    </button>
    <div class="screen-info" id="screen-info" aria-live="polite"></div>
  </div>

  <ul class="reels" id="reels"><!-- content.work --></ul>
</section>

<!-- ============ PHOTOGRAPHY: albums as stacks of prints ============ -->
<section id="photography" class="photos" aria-labelledby="photos-title">
  <div class="photos-head">
    <h2 class="photos-title rv" id="photos-title">Photography</h2>
    <div class="photos-nav rv" style="--d:140ms">
      <button class="icon-btn" id="photos-prev" type="button" aria-label="Previous albums">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="icon-btn" id="photos-next" type="button" aria-label="Next albums">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
  <ul class="photos-row" id="photos-row"><!-- photography albums from content.work --></ul>
</section>

<!-- ============ ABOUT: portrait as drop cap ============ -->
<section id="about" class="about" aria-labelledby="about-title">
  <aside class="about-facts">
    <h2 class="about-title rv" id="about-title">About</h2>
    <dl class="stats rv" id="stats" style="--d:80ms"><!-- content.stats --></dl>
    <div class="kit rv" style="--d:160ms">
      <h3>Kit</h3>
      <ul id="kit"><!-- content.about.kit --></ul>
    </div>
  </aside>
  <div class="about-body">
    <p class="about-lead rv">
      <span class="portrait" id="portrait"><span class="portrait-empty">TK</span></span>
      <span id="about-lead"></span>
    </p>
    <div class="about-more rv" id="about-more" style="--d:90ms"></div>
    <p class="about-caption rv" id="portrait-caption" style="--d:160ms"></p>
  </div>
</section>

<!-- ============ ROLES: giant word, filled bars ============ -->
<section id="roles" class="credits" aria-labelledby="credits-title">
  <div class="credits-col">
    <h2 class="credits-word rv" id="credits-title"><span id="credits-word">Roles</span></h2>
    <div class="credits-list" id="timeline"><!-- content.history --></div>
  </div>
</section>

</main>

<!-- ============ CONTACT: the email as display type ============ -->
<footer id="contact" class="contact">
  <h2 class="contact-ask rv">Have a project in mind?</h2>
  <p class="contact-mail"><a class="contact-email" id="contact-email" href="#"></a></p>
  <div class="contact-foot">
    <p id="contact-where"></p>
    <ul class="socials" id="socials"><!-- content.contact.socials --></ul>
  </div>
  <p class="fine">© <span id="year"></span> <span id="fine-name">Tharun Kumar</span>. Cut frame by frame.</p>
</footer>

<!-- ============ PROJECT VIEWER ============ -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="icon-btn modal-close" id="modal-close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <!-- edits / films: a single video or still -->
    <div id="modal-single">
      <div class="modal-thumb" id="modal-thumb"></div>
    </div>

    <!-- instagram post / reel -->
    <div id="modal-embed" style="display:none">
      <div class="ig-frame" id="ig-frame"></div>
    </div>

    <!-- photography: the whole album as an auto-playing slideshow -->
    <div id="modal-album" style="display:none">
      <div class="album-stage" id="album-stage">
        <div class="album-main" id="album-main"></div>
        <button class="icon-btn album-arrow prev" id="album-prev" aria-label="Previous photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="icon-btn album-arrow next" id="album-next" aria-label="Next photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <div class="album-progress" aria-hidden="true"><span id="album-bar"></span></div>
      </div>
      <div class="album-nav">
        <button id="album-toggle" class="album-toggle" aria-label="Pause slideshow">
          <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
          <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>
        </button>
        <span id="album-count"></span>
        <span class="album-caption" id="album-caption"></span>
      </div>
      <div class="album-thumbs" id="album-thumbs"></div>
    </div>

    <div class="modal-text">
      <h3 id="modal-title"></h3>
      <p class="modal-meta" id="modal-meta"></p>
      <p class="modal-desc" id="modal-desc"></p>
      <a class="btn" id="modal-link" href="#" target="_blank" rel="noopener">View project</a>
    </div>
  </div>
</div>

<script src="content.js"></script>
<script src="script.js"></script>
<script src="particles.js"></script>
</body>
</html>
