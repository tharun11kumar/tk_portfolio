<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tharun Kumar — Editor / Photographer / Filmmaker</title>
<meta name="description" content="Portfolio of Tharun Kumar — video editor, photographer and filmmaker.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="loader" id="loader" aria-hidden="true">
  <div class="clap">
    <div class="clap-top"></div>
    <div class="clap-bottom"></div>
  </div>
  <p class="loader-text">TK — LOADING REEL</p>
</div>

<div class="bg-glow bg-glow-a" aria-hidden="true"></div>
<div class="bg-glow bg-glow-b" aria-hidden="true"></div>

<div class="grain" aria-hidden="true"></div>

<nav class="side-nav" id="side-nav">
  <a href="#gate" class="side-logo"><span class="logo-mark"></span></a>
  <div class="side-links">
    <a href="#work">Work</a>
    <a href="#about">About</a>
    <a href="#history">Experience</a>
    <a href="#contact">Contact</a>
  </div>
  <a href="#contact" class="side-cta">Talk</a>
</nav>

<button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
<div class="mobile-nav-overlay" id="mobile-nav-overlay">
  <a href="#work">Work</a>
  <a href="#about">About</a>
  <a href="#history">Experience</a>
  <a href="#contact">Contact</a>
  <a href="#contact" class="mobile-cta">Let's talk →</a>
</div>

<div class="timecode" id="timecode" aria-hidden="true">00:00:00:00</div>

<!-- ============ GATE / LANDING ============ -->
<section id="gate" class="gate">
  <div class="gate-inner">
    <div class="slate glass" id="slate"><!-- populated by script.js from content.hero.slate --></div>

    <h1 class="gate-name" id="gate-name">Tharun Kumar</h1>
    <p class="gate-role" id="gate-role"><!-- populated by script.js --></p>
    <p class="gate-blurb" id="gate-blurb"><!-- populated by script.js --></p>

    <p class="gate-question">Load a reel —</p>
    <div class="reel-select" id="reel-select">
      <!-- populated by script.js from content.categories -->
    </div>
  </div>
</section>

<!-- ============ ABOUT ============ -->
<section id="about" class="about">
  <div class="about-portrait reveal">
    <div class="portrait-frame" id="portrait"><span>PORTRAIT</span></div>
    <div class="sprocket left"></div>
    <div class="sprocket right"></div>
  </div>
  <div class="about-copy reveal" style="--d:0.15s">
    <h2>About</h2>
    <div id="about-text" class="about-text"><!-- populated by script.js --></div>
    <div class="kit">
      <h3>Kit &amp; Tools</h3>
      <div class="marquee-wrap">
        <div class="chips" id="kit-chips"><!-- populated by script.js --></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ STATS ============ -->
<section id="stats" class="stats">
  <div class="stats-strip glass reveal">
    <div class="stats-track" id="stats-grid"><!-- populated by script.js from content.stats --></div>
  </div>
</section>

<!-- ============ WORK ============ -->
<section id="work" class="work">
  <div class="section-head reveal">
    <h2>Selected Work</h2>
    <div class="tabs" id="tabs"><!-- populated by script.js --></div>
  </div>
  <div class="grid" id="work-grid"><!-- populated by script.js --></div>
</section>

<!-- ============ EXPERIENCE ============ -->
<section id="history" class="history">
  <div class="section-head reveal">
    <h2>Experience</h2>
    <p class="section-sub">A timeline, not a résumé.</p>
  </div>
  <div class="timeline" id="timeline"><!-- populated by script.js --></div>
</section>

<!-- ============ CONTACT ============ -->
<footer id="contact" class="contact">
  <h2 class="reveal">Let's make something.</h2>
  <a class="contact-email reveal" id="contact-email" href="#" style="--d:0.1s"></a>
  <div class="socials reveal" id="socials" style="--d:0.2s"><!-- populated by script.js --></div>
  <p class="fine-print">© <span id="year"></span> Tharun Kumar. Built frame by frame.</p>
</footer>

<!-- ============ PROJECT MODAL ============ -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Close" data-cursor="Close">✕</button>
    <!-- shown for edits / films (single video or image) -->
    <div id="modal-single">
      <div class="modal-thumb" id="modal-thumb"></div>
    </div>

    <!-- shown for photography (multi-photo album) -->
    <div id="modal-album" style="display:none">
      <div class="album-main" id="album-main"></div>
      <div class="album-nav">
        <button id="album-prev" aria-label="Previous photo">‹</button>
        <span id="album-count"></span>
        <button id="album-next" aria-label="Next photo">›</button>
      </div>
      <div class="album-thumbs" id="album-thumbs"></div>
    </div>

    <p class="modal-cat" id="modal-cat"></p>
    <h3 id="modal-title"></h3>
    <p class="modal-meta" id="modal-meta"></p>
    <p id="modal-desc"></p>
    <a id="modal-link" href="#" target="_blank" rel="noopener">View project ↗</a>
  </div>
</div>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
